# Interface contracts

HTTP JSON API. Cursor pagination. Idempotency key header on all POST. Error body: code, message, details array.

base: https://api.example.invalid/v1

paths:
  /boards:
    get:
      responses: [200 BoardPage]
    post:
      body: {title: string 1..120, visibility: enum(private, workspace)}
      responses: [201 Board, 402 quota-exceeded]
  /boards/{boardId}:
    get: {responses: [200 Board, 404]}
    patch: {body: {title?: string, visibility?: enum}, responses: [200 Board, 404]}
    delete: {responses: [204, 404]}
  /boards/{boardId}/columns:
    get: {responses: [200 ColumnList]}
    post: {body: {title: string 1..64}, responses: [201 Column, 402 quota-exceeded]}
  /columns/{columnId}:
    patch: {body: {title?: string, position?: integer, archived?: boolean}, responses: [200 Column, 404, 409]}
    delete: {responses: [204, 404]}
  /boards/{boardId}/cards:
    get:
      query: {q?: string, label?: id, member?: id, due?: enum(overdue, today, week, none), cursor?: string, limit?: 1..100 default 50}
      responses: [200 CardPage]
    post:
      body: {columnId: id, title: string 1..16384, description?: string, labelIds?: id[], memberIds?: id[], dueAt?: datetime}
      responses: [201 Card, 402 quota-exceeded, 422]
  /cards/{cardId}:
    get: {responses: [200 Card, 404]}
    patch: {body: {title?, description?, labelIds?, memberIds?, dueAt?, completed?}, responses: [200 Card, 404, 422]}
    post /move: {body: {columnId: id, position: integer}, responses: [200 Card, 404, 409]}
    post /archive: {responses: [200 Card]}
    post /restore: {responses: [200 Card]}
    delete: {responses: [204, 404]}
  /cards/{cardId}/checklists:
    get: {responses: [200 ChecklistList]}
    post: {body: {title: string 1..64}, responses: [201 Checklist]}
  /checklists/{checklistId}/items:
    post: {body: {text: string 1..256, assigneeId?: id, dueAt?: datetime}, responses: [201 Item]}
  /checklist-items/{itemId}:
    patch: {body: {text?, done?, assigneeId?, dueAt?}, responses: [200 Item]}
    delete: {responses: [204]}
  /cards/{cardId}/comments:
    get: {responses: [200 CommentPage]}
    post: {body: {body: string 1..4096}, responses: [201 Comment, 429 rate-limited]}
  /boards/{boardId}/activity:
    get: {query: {cursor?, limit?}, responses: [200 ActivityPage]}
  /boards/{boardId}/rules:
    get: {responses: [200 RuleList]}
    post: {body: {trigger: ref, actions: 1..3 refs}, responses: [201 Rule, 402 quota-exceeded]}
  /rules/{ruleId}:
    patch: {body: {enabled?: boolean}, responses: [200 Rule]}
    delete: {responses: [204]}
  /search:
    get: {query: {q: string, boardId?: id}, responses: [200 CardPage]}

types:
  Board: {id, title, visibility, columnIds[], memberIds[], guestIds[], createdAt, updatedAt}
  Column: {id, boardId, title, position, archived}
  Card: {id, columnId, title, description, position, labelIds[], memberIds[], dueAt?, reminderOffset?, completed, archived, deletedAt?, createdAt, updatedAt}
  Label: {id, boardId, name 1..32, color 1..10}
  Checklist: {id, cardId, title, position, itemCount, doneCount}
  ChecklistItem: {id, checklistId, text, done, assigneeId?, dueAt?}
  Comment: {id, cardId, authorId, body, createdAt}
  ActivityEntry: {id, boardId?, cardId?, actorId, action, detail, at}
  Rule: {id, boardId, trigger, actions[], enabled, runsThisMonth}
  SavedFilter: {id, ownerId, boardId, name, criteria}
  error: {code, message, details[]}

rules:
  - Cursor pagination returns nextCursor null at end.
  - Datetimes are RFC 3339 with offset.
  - Ids are opaque strings of at most 64 characters.
  - Rate limit: 600 requests per minute per member; 429 with retry-after.
